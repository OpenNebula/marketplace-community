---
:app:
  :name: cvmfs-proxy  # name used to make the app with the makefile
  :type: service  # there are service (complex apps) and distro (base apps)
  :os:
    :type: linux  # linux, freebsd or windows
    :base: ubuntu2404  # distro where the app runs on
  :hypervisor: KVM
  :context:  # which context params are used to control the app
    # The names below already carry ONEAPP_. With true the harness would add it a second time.
    :prefixed: false
    :params:
      # Sizes that differ from the defaults, so the tests prove the context reaches squid.conf.
      :ONEAPP_ACCESS_CLIENTS_NETWORKS: ''
      :ONEAPP_ACCESS_DESTINATIONS_DOMAINS: '.cern.ch .gridpp.rl.ac.uk .opensciencegrid.org .eessi.science'
      :ONEAPP_CACHE_SIZE_DISK: '5000'
      :ONEAPP_CACHE_SIZE_MEMORY: '512'
      :ONEAPP_CACHE_DISK_ENABLED: 'NO'

:one:
  # reference template for running the virtual appliance.
  # Must be diskless, with ssh access and accessible by the frontend
  :template:  # how the VM template is expected to be on OpenNebula
    NAME: base
    TEMPLATE:
      ARCH: x86_64
      CONTEXT:
        NETWORK: 'YES'
        SET_HOSTNAME: "$NAME"
        SSH_PUBLIC_KEY: "$USER[SSH_PUBLIC_KEY]"
        TOKEN: 'YES'
      CPU: '1'
      VCPU: '2'
      CPU_MODEL:
        MODEL: host-passthrough
      GRAPHICS:
        LISTEN: 0.0.0.0
        TYPE: vnc
      MEMORY: '2048'
      NIC:
        NETWORK: service
      NIC_DEFAULT:
        MODEL: virtio
  :datastore_name: default  # target datastore to import the one-apps produced image
  :timeout: '90'  # timeout for XMLRPC calls

:infra:
  :disk_format: qcow2  # oneapps built image disk format
  :apps_path: /var/tmp  # directory where one-apps exports the appliances to
