---
name: OpenNebula Front-end
version: '1.0'
one-apps_version: 7.0.0-0
publisher: OpenNebula Community
publisher_email: community@opennebula.io
description: |-
  Deploy a complete [OpenNebula](https://opennebula.io) lab inside your own
  OpenNebula cloud ("OpenNebula over OpenNebula"). This appliance turns a single
  Ubuntu 24.04 LTS VM into a self-contained OpenNebula front-end using the
  upstream [miniONE](https://github.com/OpenNebula/minione) installer, which
  pulls the latest OpenNebula release.

  On first boot it deploys the OpenNebula front-end (oned, the FireEdge web UI,
  OneGate and OneFlow) plus a co-located local KVM/QEMU node and a default lab
  virtual network, so you can log in to FireEdge and launch VMs straight away.
  Hardware virtualization is detected automatically: KVM is used when the host
  exposes nested virtualization, and QEMU software emulation is used otherwise,
  so the lab boots everywhere (just slower without nested virt).

  The oneadmin password is injected at instantiation through OpenNebula
  contextualization (or auto-generated and reported, never baked into the
  image). Choose what to deploy: "Front-end + KVM node" (a complete single-VM
  lab that launches VMs) or "Front-end only" (just the control plane, to manage
  external KVM hosts). This is an evaluation, training and demo lab, not a
  production deployment.
short_description: >-
  Self-contained OpenNebula lab (front-end plus a local KVM/QEMU node), latest
  release, built with miniONE and ready to deploy inside another OpenNebula cloud.
tags:
- opennebula
- minione
- lab
- frontend
- fireedge
- kvm
- iaas
- cloud
- ubuntu
- service
