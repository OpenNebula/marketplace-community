publisher: OpenNebula Systems
publisher_email: contact@opennebula.io
description: |-
  [Open OnDemand](https://openondemand.org/) is the web portal that gives HPC users a
  browser interface to a cluster: a file browser, a shell, job submission and interactive
  applications such as JupyterLab, RStudio, Octave and VS Code.

  This appliance puts the three roles of the Open OnDemand service in a single image,
  selected at boot with the `ONEAPP_ROLE` context variable:

  - **portal**, the Open OnDemand web portal with its own LDAP directory and Dex
    authentication.
  - **storage**, the shared home over NFS and the site cache for the software catalogue.
  - **worker**, a compute VM that runs user sessions inside Apptainer containers.

  Scientific software comes from [EESSI](https://www.eessi.io/) over CernVM-FS, so a
  notebook here loads the same modules a user would find at a EuroHPC centre.

  Deploy it with the Open OnDemand Service appliance, which connects the three roles with
  OneFlow and grows the pool of compute VMs with the number of open sessions.
short_description: Open OnDemand portal, shared storage and elastic compute pool in one image
