---
name: Open OnDemand Service
version: 1.0.0-20260916
publisher: OpenNebula Systems
publisher_email: contact@opennebula.io
description: |-
  A complete [Open OnDemand](https://openondemand.org/) deployment on OpenNebula,
  orchestrated by
  [OneFlow](https://docs.opennebula.io/7.4/product/operation_references/opennebula_services_configuration/oneflow/).

  Three roles start in order:

  1. **storage** exports the shared home over NFS and runs the site cache that serves the
     [EESSI](https://www.eessi.io/) software catalogue over CernVM-FS.
  2. **portal** runs Open OnDemand with its own LDAP directory, so adding a user is one
     directory entry and their home appears on first login.
  3. **worker** runs the user sessions. Each session opens over SSH inside an Apptainer
     container, with the scientific software loaded from EESSI.

  The worker role is elastic. Every worker reports its open session count to OneGate, and
  OneFlow adds a VM when the average passes the threshold and removes one after a quiet
  period. The portal sends each new session to the least loaded worker, so a VM added by
  the autoscaler receives work immediately instead of sitting idle.

  Requires
  [OneFlow](https://docs.opennebula.io/7.4/product/operation_references/opennebula_services_configuration/oneflow/)
  and
  [OneGate](https://docs.opennebula.io/7.4/product/virtual_machines_operation/multi-vm_workflows/onegate_usage/),
  and OneGate must be reachable from the service network.

  Based on the VM template
  - [Open OnDemand](https://community-marketplace.opennebula.io/appliance/b65a3b9d-1463-4e3d-87d6-6df37fa23361)
short_description: Open OnDemand with an elastic pool of compute VMs, orchestrated by OneFlow
tags:
- open-ondemand
- hpc
- jupyter
- eessi
- ubuntu
- service
creation_time: 1789556598
os-id: Ubuntu
os-release: '24.04 LTS'
os-arch: x86_64
hypervisor: KVM
opennebula_version: 6.10, 7.0, 7.2, 7.4
type: 'SERVICE_TEMPLATE'
roles:
  storage: 'Open OnDemand'
  portal: 'Open OnDemand'
  worker: 'Open OnDemand'
opennebula_template:
  name: Open OnDemand
  deployment: straight
  description: 'Open OnDemand portal with shared storage and an elastic pool of compute VMs'
  ready_status_gate: true
  # A value one role takes from another goes as a plain line here and reaches the VM through
  # the "$NAME" reference the image template declares in its CONTEXT. OneFlow resolves the
  # ${role...} references and the network names, and copies the service inputs into every
  # VM by itself, so they are not repeated per role.
  roles:
  - name: storage
    cardinality: 1
    min_vms: 1
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      ONEAPP_ROLE = "storage"
    cooldown: 120
    elasticity_policies: []
    scheduled_policies: []
  - name: portal
    parents:
    - storage
    cardinality: 1
    min_vms: 1
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      MEMORY = "8192"
      ONEAPP_ROLE = "portal"
      ONEAPP_NFS_HOST = "${storage.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_CVMFS_PROXY = "http://${storage.TEMPLATE.CONTEXT.ETH1_IP}:3128"
    cooldown: 120
    elasticity_policies: []
    scheduled_policies: []
  - name: worker
    parents:
    - storage
    - portal
    cardinality: 1
    min_vms: 1
    max_vms: 6
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      ONEAPP_ROLE = "worker"
      ONEAPP_NFS_HOST = "${storage.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_LDAP_HOST = "${portal.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_CVMFS_PROXY = "http://${storage.TEMPLATE.CONTEXT.ETH1_IP}:3128"
    cooldown: 120
    elasticity_policies:
    - type: CHANGE
      adjust: 1
      expression: 'ACTIVE_SESSIONS > 1'
      period_number: 1
      period: 30
      cooldown: 120
    # Every worker at its session cap, ONEAPP_WORKER_MAX_SESSIONS, grows the pool too.
    - type: CHANGE
      adjust: 1
      expression: 'AT_CAPACITY > 0.99'
      period_number: 1
      period: 30
      cooldown: 120
    # Scale down one worker at a time. OneFlow evaluates the average of the attribute across
    # the VMs of the role and when reducing it terminates the oldest one without draining it,
    # so a condition on the number of sessions would power off a busy worker as soon as
    # another one was free. Every worker publishes OLDEST_IDLE, 1 when the oldest worker of
    # the role has had no session for ONEAPP_WORKER_IDLE_SECONDS, so the average is 1 only
    # when all of them agree that the VM OneFlow is about to remove is empty. The portal
    # sends new sessions to the youngest worker among the least loaded, so the oldest drains.
    - type: CHANGE
      adjust: -1
      expression: 'OLDEST_IDLE > 0.99'
      period_number: 2
      period: 60
      cooldown: 300
    scheduled_policies: []
  networks:
    Management: 'M|network|Management network, reaches OneGate and the internet| |id::'
    Compute: 'M|network|Compute network, reserved for the service| |id::'
  # Every input is optional, so a first start changes nothing here. The key order is the
  # order of the tabs in the instantiate wizard, one tab per second token of the name and
  # one section per third token, with the other inputs of a section shown only while its
  # _ENABLED switch is on. The portal derives the worker range from its compute interface,
  # so no range is asked. ONEAPP_WORKER_IDLE_SECONDS, ONEAPP_WORKER_MAX_SESSIONS and
  # ONEAPP_POOL_RANGE are advanced attributes for the vm_template_contents of a role.
  custom_attrs:
    ONEAPP_PORTAL_HOST_NAME: 'O|text|Public host name of the portal, empty to use its address||'
    ONEAPP_PORTAL_LETSENCRYPT_ENABLED: 'O|boolean|Request a Let''s Encrypt certificate for the host name||NO'
    ONEAPP_PORTAL_CERTIFICATE_ENABLED: 'O|boolean|Use a certificate of your own||NO'
    ONEAPP_PORTAL_CERTIFICATE_CHAIN: 'O|text64|PEM certificate chain||'
    ONEAPP_PORTAL_CERTIFICATE_KEY: 'O|text64|PEM private key||'
    ONEAPP_AUTH_LOCAL_USERS: 'O|text|Initial users, user:password separated by spaces, a uid may follow as user:password:uid||demo1:demo1pass'
    ONEAPP_AUTH_OIDC_ENABLED: 'O|boolean|Sign in through an OpenID Connect provider as well||NO'
    ONEAPP_AUTH_OIDC_ISSUER: 'O|text|Issuer URL of the provider||'
    ONEAPP_AUTH_OIDC_CLIENT_ID: 'O|text|Client id registered at the provider||'
    ONEAPP_AUTH_OIDC_CLIENT_SECRET: 'O|password|Client secret registered at the provider||'
    ONEAPP_AUTH_OIDC_NAME: 'O|text|Name of the provider on the login page||Institutional login'
    ONEAPP_HOME_NFS_ENABLED: 'O|boolean|Use an NFS server of your own instead of the storage role||NO'
    ONEAPP_HOME_NFS_SERVER: 'O|text|Address of the NFS server||'
    ONEAPP_HOME_NFS_EXPORT: 'O|text|Path of the home export||/export/home'
    ONEAPP_SLURM_CONTROLLER_ENABLED: 'O|boolean|Submit batch jobs to a Slurm cluster that shares the users and the home||NO'
    ONEAPP_SLURM_CONTROLLER_HOST: 'O|text|Address of the Slurm controller||'
  # Titles of the tabs (APP) and titles and descriptions of the sections (GROUP) of the wizard.
  # OneFlow keeps this key in the service template body, and FireEdge reads it. A tab carries no
  # description on purpose, see the image template.
  user_inputs_metadata:
  - name: PORTAL
    type: APP
    title: Portal
  - name: HOST
    type: GROUP
    title: Host name
    description: Users open the portal at https://<host name>; with no host name they use the management address
  - name: LETSENCRYPT
    type: GROUP
    title: Let's Encrypt
    description: Needs a host name that resolves to the portal and ports 80 and 443 reachable from the Internet when the portal boots
  - name: CERTIFICATE
    type: GROUP
    title: Your own certificate
    description: Paste the chain and the key in PEM, they replace the self-signed one
  - name: AUTH
    type: APP
    title: Users and login
  - name: LOCAL
    type: GROUP
    title: Local users
    description: Accounts created in the directory of the portal at first boot
  - name: OIDC
    type: GROUP
    title: OpenID Connect
    description: An institutional login next to the local one, for example MyAccessID or Keycloak
  - name: HOME
    type: APP
    title: Home directories
  - name: NFS
    type: GROUP
    title: NFS server of your own
    description: By default the storage role exports the home directories; with a server of your own the storage role only keeps the software cache
  - name: SLURM
    type: APP
    title: Slurm
  - name: CONTROLLER
    type: GROUP
    title: Controller
    description: A OneSlurm service on the same compute network, see the Slurm page of the documentation
logo: logos/openondemand.png
images: []
