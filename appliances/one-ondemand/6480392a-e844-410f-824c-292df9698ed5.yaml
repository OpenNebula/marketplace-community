---
name: Open OnDemand Service
version: 1.0.0-20260915
publisher: OpenNebula Systems
publisher_email: contact@opennebula.io
description: |-
  A complete [Open OnDemand](https://openondemand.org/) deployment on OpenNebula,
  orchestrated by
  [OneFlow](https://docs.opennebula.io/7.4/product/operation_references/opennebula_services_configuration/oneflow/).

  Three roles start in order:

  1. **storage** exports the shared home over NFS and runs the site cache that serves the
     [EESSI](https://www.eessi.io/) software catalogue over CernVM-FS.
  2. **portal** runs Open OnDemand with its own LDAP directory, so adding a user is one
     directory entry and their home appears on first login.
  3. **worker** runs the user sessions. Each session opens over SSH inside an Apptainer
     container, with the scientific software loaded from EESSI.

  The worker role is elastic. Every worker reports its open session count to OneGate, and
  OneFlow adds a VM when the average passes the threshold and removes one after a quiet
  period. The portal sends each new session to the least loaded worker, so a VM added by
  the autoscaler receives work immediately instead of sitting idle.

  Requires
  [OneFlow](https://docs.opennebula.io/7.4/product/operation_references/opennebula_services_configuration/oneflow/)
  and
  [OneGate](https://docs.opennebula.io/7.4/product/virtual_machines_operation/multi-vm_workflows/onegate_usage/),
  and OneGate must be reachable from the service network.

  Based on the VM template
  - [Open OnDemand](https://community-marketplace.opennebula.io/appliance/b65a3b9d-1463-4e3d-87d6-6df37fa23361)
short_description: Open OnDemand with an elastic pool of compute VMs, orchestrated by OneFlow
tags:
- open-ondemand
- hpc
- jupyter
- eessi
- ubuntu
- service
creation_time: 1789463841
os-id: Ubuntu
os-release: '24.04 LTS'
os-arch: x86_64
hypervisor: KVM
opennebula_version: 6.10, 7.0, 7.2, 7.4
type: 'SERVICE_TEMPLATE'
roles:
  storage: 'Open OnDemand'
  portal: 'Open OnDemand'
  worker: 'Open OnDemand'
opennebula_template:
  name: Open OnDemand
  deployment: straight
  description: 'Open OnDemand portal with shared storage and an elastic pool of compute VMs'
  ready_status_gate: true
  # A value one role takes from another goes as a plain line here and reaches the VM through
  # the "$NAME" reference the image template declares in its CONTEXT. OneFlow resolves the
  # ${role...} references and the network names, and copies the service inputs into every
  # VM by itself, so they are not repeated per role.
  roles:
  - name: storage
    cardinality: 1
    min_vms: 1
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      ONEAPP_ROLE = "storage"
    cooldown: 120
    elasticity_policies: []
    scheduled_policies: []
  - name: portal
    parents:
    - storage
    cardinality: 1
    min_vms: 1
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      MEMORY = "8192"
      ONEAPP_ROLE = "portal"
      ONEAPP_NFS_HOST = "${storage.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_CVMFS_PROXY = "http://${storage.TEMPLATE.CONTEXT.ETH1_IP}:3128"
    cooldown: 120
    elasticity_policies: []
    scheduled_policies: []
  - name: worker
    parents:
    - storage
    - portal
    cardinality: 1
    min_vms: 1
    max_vms: 6
    vm_template_contents: |
      NIC = [
        NAME = "NIC0",
        NETWORK_ID = "$Management"
      ]
      NIC = [
        NAME = "NIC1",
        NETWORK_ID = "$Compute"
      ]
      ONEAPP_ROLE = "worker"
      ONEAPP_NFS_HOST = "${storage.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_LDAP_HOST = "${portal.TEMPLATE.CONTEXT.ETH1_IP}"
      ONEAPP_CVMFS_PROXY = "http://${storage.TEMPLATE.CONTEXT.ETH1_IP}:3128"
    cooldown: 120
    elasticity_policies:
    - type: CHANGE
      adjust: 1
      expression: 'ACTIVE_SESSIONS > 1'
      period_number: 1
      period: 30
      cooldown: 120
    # Every worker at its session cap, ONEAPP_WORKER_MAX_SESSIONS, grows the pool too.
    - type: CHANGE
      adjust: 1
      expression: 'AT_CAPACITY > 0.99'
      period_number: 1
      period: 30
      cooldown: 120
    # Scale down one worker at a time. OneFlow evaluates the average of the attribute across
    # the VMs of the role and when reducing it terminates the oldest one without draining it,
    # so a condition on the number of sessions would power off a busy worker as soon as
    # another one was free. Every worker publishes OLDEST_IDLE, 1 when the oldest worker of
    # the role has had no session for ONEAPP_WORKER_IDLE_SECONDS, so the average is 1 only
    # when all of them agree that the VM OneFlow is about to remove is empty. The portal
    # sends new sessions to the youngest worker among the least loaded, so the oldest drains.
    - type: CHANGE
      adjust: -1
      expression: 'OLDEST_IDLE > 0.99'
      period_number: 2
      period: 60
      cooldown: 300
    scheduled_policies: []
  networks:
    Management: 'M|network|Management network, reaches OneGate and the internet| |id::'
    Compute: 'M|network|Compute network, reserved for the service| |id::'
  custom_attrs:
    ONEAPP_POOL_RANGE: 'M|text|Address range the compute network assigns to VMs, first-last||172.20.0.50-172.20.0.249'
    ONEAPP_OOD_SERVERNAME: 'O|text|Public host name of the portal, empty to use its address||'
    ONEAPP_OOD_SSL_MODE: 'O|list|TLS certificate|letsencrypt,selfsigned,custom|selfsigned'
    ONEAPP_OOD_SSL_CERT: 'O|text64|PEM certificate chain, for the custom mode||'
    ONEAPP_OOD_SSL_KEY: 'O|text64|PEM private key, for the custom mode||'
    ONEAPP_LDAP_USERS: 'O|text|Initial users, user:password:uid separated by spaces||demo1:demo1pass:10001'
    ONEAPP_WORKER_IDLE_SECONDS: 'O|number|Seconds a worker stays empty before the pool shrinks||600'
    ONEAPP_WORKER_MAX_SESSIONS: 'O|number|Sessions a worker takes before the pool grows||4'
    ONEAPP_SLURM_CONTROLLER: 'O|text|Slurm controller sharing the users and the home, empty for none||'
    ONEAPP_OIDC_ISSUER: 'O|text|Issuer URL of an OpenID Connect provider, empty for the local directory only||'
    ONEAPP_OIDC_CLIENT_ID: 'O|text|Client id registered at that provider||'
    ONEAPP_OIDC_CLIENT_SECRET: 'O|password|Client secret registered at that provider||'
    ONEAPP_OIDC_NAME: 'O|text|Name of the provider on the login page||Institutional login'
    ONEAPP_NFS_SERVER: 'O|text|NFS server of your own for the home, empty to use the storage role||'
    ONEAPP_NFS_EXPORT: 'O|text|Path of the home export||/export/home'
logo: logos/openondemand.png
images: []
