---
:app:
  :name: one-ondemand  # name used to make the app with the makefile
  :type: service  # there are service (complex apps) and distro (base apps)
  :os:
    :type: linux  # linux, freebsd or windows
    :base: ubuntu2404  # distro where the app runs on
  :hypervisor: KVM
  :context:  # which context params are used to control the app
    :prefixed: true  # params are prefixed with ONEAPP_
    :params:
      # The role decides what is configured at boot. worker is the one that can be tested
      # on its own, without the other two, so it is the one the certification harness uses.
      :ONEAPP_ROLE: 'worker'
      :ONEAPP_NFS_HOST: ''
      :ONEAPP_LDAP_HOST: ''
      :ONEAPP_CVMFS_PROXY: ''

:one:
  # reference template for running the virtual appliance.
  # Must be diskless, with ssh access and accessible by the frontend
  :template:  # how the VM template is expected to be on OpenNebula
    NAME: base
    TEMPLATE:
      ARCH: x86_64
      CONTEXT:
        NETWORK: 'YES'
        SET_HOSTNAME: "$NAME"
        SSH_PUBLIC_KEY: "$USER[SSH_PUBLIC_KEY]"
        TOKEN: 'YES'
      CPU: '1'
      VCPU: '2'
      CPU_MODEL:
        MODEL: host-passthrough
      GRAPHICS:
        LISTEN: 0.0.0.0
        TYPE: vnc
      MEMORY: '4096'
      NIC:
        NETWORK: service
      NIC_DEFAULT:
        MODEL: virtio
  :datastore_name: default  # target datastore to import the one-apps produced image
  :timeout: '600'  # timeout for XMLRPC calls

:infra:
  :disk_format: qcow2  # oneapps built image disk format
  :apps_path: /var/tmp  # directory where one-apps exports the appliances to
