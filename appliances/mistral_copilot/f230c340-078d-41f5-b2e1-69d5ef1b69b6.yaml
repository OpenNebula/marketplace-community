# Mistral Copilot Marketplace Metadata
#
# After a successful build, update these PLACEHOLDER values:
#   1. images[0].url          -- Replace PUBLISH_URL with actual hosting URL
#   2. images[0].checksum.md5 -- From: md5sum build/export/mistral_copilot-2.8.0.qcow2
#   3. images[0].checksum.sha256 -- From: sha256sum build/export/mistral_copilot-2.8.0.qcow2
#   4. images[0].size         -- From: qemu-img info --output=json build/export/mistral_copilot-2.8.0.qcow2 | jq '.["virtual-size"]'
#   5. Rename this file to a UUID for marketplace PR: cp marketplace.yaml $(uuidgen).yaml
#
---
name: Mistral Copilot
version: '1.1'
publisher: OpenNebula Systems
description: |-
  Mistral Copilot is an
  AI coding assistant that serves an open-source LLM over an
  OpenAI-compatible HTTPS API. It runs
  [Mistral 7B Instruct](https://mistral.ai/news/announcing-mistral-7b) on CPU via
  [llama.cpp](https://github.com/ggerganov/llama.cpp), so a GPU is optional, and
  the built-in model fits on a small 4+ vCPU / 8 GB VM. Larger Mistral models
  (Devstral Small 2, Mistral Small, Mistral Nemo) are opt-in from the
  instantiation wizard and download on first boot.

  Two modes are supported: standalone inference on a single VM with llama.cpp,
  or a load-balanced pool where a [LiteLLM](https://litellm.ai) proxy spreads
  requests across several VMs. The pool pairs naturally with OpenNebula's native
  federation to scale a shared copilot across zones and edge sites.

  Connect aider, Continue, Cline, or any OpenAI-compatible client with a bearer
  token, and keep your code and data on your own infrastructure.
short_description: >-
  AI coding assistant serving a Mistral LLM over an OpenAI-compatible
  API, on CPU with GPU optional.
tags:
  - ai
  - llm
  - coding
  - copilot
  - sovereign
  - cpu
  - llama-cpp
  - mistral
  - aider
  - ubuntu
format: qcow2
creation_time: 1781604539
os-id: Ubuntu
os-release: '24.04 LTS'
os-arch: x86_64
hypervisor: KVM
opennebula_version: 6.10, 7.0
opennebula_template:
  CONTEXT:
    NETWORK: 'YES'
    USERNAME_PASSWORD_RESET: 'YES'
    SSH_PUBLIC_KEY: "$USER[SSH_PUBLIC_KEY]"
    ONEAPP_COPILOT_AI_MODEL: '$ONEAPP_COPILOT_AI_MODEL'
    ONEAPP_COPILOT_CONTEXT_SIZE: '$ONEAPP_COPILOT_CONTEXT_SIZE'
    ONEAPP_COPILOT_CPU_THREADS: '$ONEAPP_COPILOT_CPU_THREADS'
    ONEAPP_COPILOT_API_PASSWORD: '$ONEAPP_COPILOT_API_PASSWORD'
    ONEAPP_COPILOT_TLS_DOMAIN: '$ONEAPP_COPILOT_TLS_DOMAIN'
    ONEAPP_COPILOT_LB_ENABLED: '$ONEAPP_COPILOT_LB_ENABLED'
    ONEAPP_COPILOT_LB_BACKENDS: '$ONEAPP_COPILOT_LB_BACKENDS'
    ONEAPP_COPILOT_REGISTER_URL: '$ONEAPP_COPILOT_REGISTER_URL'
    ONEAPP_COPILOT_REGISTER_KEY: '$ONEAPP_COPILOT_REGISTER_KEY'
    ONEAPP_COPILOT_REGISTER_MODEL_NAME: '$ONEAPP_COPILOT_REGISTER_MODEL_NAME'
    ONEAPP_COPILOT_REGISTER_SITE_NAME: '$ONEAPP_COPILOT_REGISTER_SITE_NAME'
    ONEAPP_COPILOT_TLS_EMAIL: '$ONEAPP_COPILOT_TLS_EMAIL'
    ONEAPP_COPILOT_TLS_CA: '$ONEAPP_COPILOT_TLS_CA'
    ONEAPP_COPILOT_REGISTER_INSECURE: '$ONEAPP_COPILOT_REGISTER_INSECURE'
  CPU: '16'
  VCPU: '16'
  CPU_MODEL:
    MODEL: host-passthrough
  GRAPHICS:
    LISTEN: 0.0.0.0
    TYPE: vnc
  MEMORY: '32768'
  NIC:
    NETWORK: service
  NIC_DEFAULT:
    MODEL: virtio
  inputs_order: >-
    ONEAPP_COPILOT_AI_MODEL,
    ONEAPP_COPILOT_CONTEXT_SIZE,
    ONEAPP_COPILOT_CPU_THREADS,
    ONEAPP_COPILOT_API_PASSWORD,
    ONEAPP_COPILOT_TLS_DOMAIN,
    ONEAPP_COPILOT_TLS_EMAIL,
    ONEAPP_COPILOT_TLS_CA,
    ONEAPP_COPILOT_REGISTER_URL,
    ONEAPP_COPILOT_REGISTER_KEY,
    ONEAPP_COPILOT_REGISTER_INSECURE,
    ONEAPP_COPILOT_REGISTER_MODEL_NAME,
    ONEAPP_COPILOT_REGISTER_SITE_NAME,
    ONEAPP_COPILOT_LB_ENABLED,
    ONEAPP_COPILOT_LB_BACKENDS
  user_inputs:
    oneapp_copilot_ai_model: >-
      M|list|AI Model|Mistral 7B Instruct (7B ~4GB built-in),Devstral Small 2 (24B ~14GB),Mistral Small Instruct (24B ~14GB),Mistral Nemo Instruct (12B ~7GB)|Mistral 7B Instruct (7B ~4GB built-in)
    oneapp_copilot_context_size: >-
      O|list|Context Window (tokens)|8192,16384,32768|8192
    oneapp_copilot_cpu_threads: >-
      O|text|CPU Threads for inference (0 = auto-detect)|0
    oneapp_copilot_api_password: >-
      O|password|API Key (empty = auto-generate)||
    oneapp_copilot_tls_domain: >-
      O|text|Domain for Let's Encrypt (empty = self-signed)||
    oneapp_copilot_tls_email: >-
      O|text|Email for Let's Encrypt registration (optional)||
    oneapp_copilot_tls_ca: >-
      O|text|Internal CA PEM to verify LB/backends (optional)||
    oneapp_copilot_register_insecure: >-
      O|boolean|Allow auto-registration to an unverified self-signed LB||NO
    oneapp_copilot_lb_enabled: >-
      O|boolean|Enable Load Balancer mode (LiteLLM proxy)||NO
    oneapp_copilot_lb_backends: >-
      O|text|Load Balancer backends (key@host:port, comma-separated)||
    oneapp_copilot_register_url: >-
      O|text|Remote LB URL for auto-registration (e.g. https://lb:8443)||
    oneapp_copilot_register_key: >-
      O|password|Remote LB master key for auto-registration||
    oneapp_copilot_register_model_name: >-
      O|text|Model name for LB registration (empty = auto)||
    oneapp_copilot_register_site_name: >-
      O|text|Site name for LB backend ID (e.g. poland0)||
